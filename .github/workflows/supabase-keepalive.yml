name: Supabase Keep-Alive

on:
  schedule:
    # Every 3 days at 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pxrtvgnoblavnibulxcr.supabase.co/rest/v1/bloxai_users?select=id&limit=1" \
            -H "apikey: sb_publishable_ZVQP5fJSiZB5tkYFUHcVlg_cvmEtfH-" \
            -H "Authorization: Bearer sb_publishable_ZVQP5fJSiZB5tkYFUHcVlg_cvmEtfH-")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "OK — project is alive"
          else
            echo "WARNING — unexpected status $STATUS"
            exit 1
          fi
